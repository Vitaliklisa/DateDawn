# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#
# 1536m (the Flutter default) is not enough for a release build with R8 and the
# Firebase/play-services graph: the daemon grows past it during minification and
# gets killed mid-task, which then shows up as an opaque "Gradle build failed".
# 4g leaves headroom on an 8 GB CI runner. `MaxMetaspaceSize` is set explicitly
# because the default metaspace ceiling (~256m) is hit when many plugin classes
# are loaded and produces "OutOfMemoryError: Metaspace" on shrink builds.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Run independent tasks in parallel across modules. Safe here: the Flutter
# plugin graph is a standard, non-decoupled multi-project build, and every
# module is configured with `evaluationDependsOn(":app")` in build.gradle.kts.
org.gradle.parallel=true

# Reuse the build cache for tasks whose inputs are unchanged — the biggest win
# on repeat builds and across CI runs that restore a cache (see the workflow).
org.gradle.caching=true

# Keep one daemon per JVM spec alive between invocations instead of paying JVM
# startup + warmup (~10-20s) on every build.
org.gradle.daemon=true

# Only compile resources for the app module's own resources; library resources
# are referenced by ID at runtime instead of being merged into the app's R
# class. Cuts resource processing time and shrinks the R class.
android.nonTransitiveRClass=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# JDK selection is deliberately NOT pinned here.
#
# This file is committed and shared by every machine and the CI runner, so a
# literal `org.gradle.java.home=C:\...\jdk-17...` path makes Gradle refuse to
# start anywhere that exact directory does not exist (Linux CI, a teammate's
# laptop, a clean clone) and shows up only as "Gradle build failed".
#
# Gradle resolves the JDK itself, in order, from:
#   1. `-Dorg.gradle.java.home=...` on the command line
#   2. `JAVA_HOME` in the environment (the CI `setup-java` step sets this)
#   3. the `java` on PATH
# To pin a JDK for your own machine only, put the line in
# `~/.gradle/gradle.properties` (user-level, never committed) or set JAVA_HOME.
