# The `-bin` distribution is the one to use for builds. `-all` additionally
# ships the Gradle sources, Javadoc and Kotlin DSL API jars — roughly double the
# download — and nothing in this project reads any of it. Switching trims the
# first-build download and the CI restore time; a version bump must keep this in
# step with the Gradle version the Flutter tooling expects.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
