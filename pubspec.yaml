name: datedawn
description: "Date Dawn — count down to the moments that matter. Flutter + Firebase, for Android, iOS and web."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Web-only: `usePathUrlStrategy` gives real, hash-free routes on web.
  flutter_web_plugins:
    sdk: flutter

  # Firebase - the whole free-tier backend: auth + shared data.
  # No `firebase_storage`: Cloud Storage needs the Blaze plan, and Date Dawn
  # launches without profile pictures. See "Avatars" in README.md.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0

  # State + routing.
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # Date maths and presentation helpers that mirror the web app's `date-fns` layer.
  intl: ^0.20.3
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  share_plus: ^13.3.0
  # Confetti for the arrival celebration (drop-in replacement for the CSS burst).
  confetti: ^0.8.0
  # `UserAvatar` renders initials in a colour derived from the account id, which
  # is a pure hash and needs no dependency.
  flutter_local_notifications: ^22.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
  mocktail: ^1.0.4
  # Icon and splash generation — run via scripts/generate-flutter-icons.mjs.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/