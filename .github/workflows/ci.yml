name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same branch.
# Without this, pushing twice leaves the first run burning CI minutes on code
# nobody is waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Matches the local command, and fails fast on formatting drift before it
      # reaches a reviewer. This is the check that was failing before.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The web build is the fastest end-to-end proof that the widget tree
      # compiles on a target that needs no signing key and no emulator.
      - name: Build web
        run: flutter build web --release

  build-android:
    name: Build Android bundle
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The Firebase config is deliberately NOT committed: it is gitignored, and
      # for good reason — committing it bakes one project's identifiers into the
      # repo and makes rotating them a code change. The Gradle google-services
      # plugin, however, hard-fails the release build without the file, which is
      # what broke `bundleRelease` on CI with:
      #
      #   File google-services.json is missing. The Google Services Plugin cannot
      #   function without it.
      #
      # So the file is restored here from a repository secret holding its full
      # JSON text. Create it with:
      #
      #   gh secret set GOOGLE_SERVICES_JSON < android/app/google-services.json
      #
      # or paste the JSON into Settings -> Secrets and variables -> Actions.
      #
      # If the secret is not set, the job must not fail: the point of this build
      # is to prove the release pipeline compiles, and a missing Firebase config
      # is a deployment concern, not a compile error. In that case a placeholder
      # with the app's real package name and project id is written instead, which
      # satisfies the google-services plugin. The artifact is unsigned anyway and
      # can never be uploaded, so the placeholder cannot reach a store.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json restored from secret ($(wc -c < android/app/google-services.json) bytes)"
          else
            echo "::warning title=google-services.json::GOOGLE_SERVICES_JSON secret is not set. "
            echo "::warning::Building with a placeholder Firebase config. This bundle is unsigned "
            echo "::warning::and must not be uploaded. Add the secret under "
            echo "::warning::Settings -> Secrets and variables -> Actions to build against the real project."
            printf '%s\n' \
              '{' \
              '  "project_info": {' \
              '    "project_number": "000000000000",' \
              '    "project_id": "datedawn",' \
              '    "storage_bucket": "datedawn.firebasestorage.app"' \
              '  },' \
              '  "client": [{' \
              '    "client_info": {' \
              '      "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",' \
              '      "android_client_info": { "package_name": "com.datedawn.app" }' \
              '    },' \
              '    "oauth_client": [],' \
              '    "api_key": [{ "current_key": "placeholder" }],' \
              '    "services": { "appinvite_service": { "other_platform_oauth_client": [] } }' \
              '  }],' \
              '  "configuration_version": "1"' \
              '}' > android/app/google-services.json
            echo "google-services.json placeholder written ($(wc -c < android/app/google-services.json) bytes)"
          fi
          test -s android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null
          echo "google-services.json is present and valid JSON"

      # Flutter's release step shells out to the NDK's `llvm-strip`. The runner
      # image ships an Android SDK without cmdline-tools, which is what made the
      # strip step fail on a developer machine; installing them here (and
      # accepting the licences) is the fix.
      - name: Ensure Android SDK tools
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            mkdir -p "${ANDROID_HOME}/cmdline-tools"
            curl -sSLo cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q cmdline-tools.zip -d "${ANDROID_HOME}/cmdline-tools"
            mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" \
               "${ANDROID_HOME}/cmdline-tools/latest"
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "ndk;28.2.13676358" > /dev/null

      # Unsigned on purpose: this proves the release build compiles and that the
      # Gradle config is sound. Signing happens locally, where the keystore and
      # its passwords live — they are never uploaded to a build server.
      #
      # No `--no-shrink`: that flag skips R8, and running the real release
      # pipeline is what catches a missing keep-rule before upload rather than in
      # the Play Console.
      - name: Build app bundle
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build appbundle --release \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
